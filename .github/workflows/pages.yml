# Publishes the game to GitHub Pages on every push to main.
# Only the files the game needs are deployed; the service-worker cache name is set
# from the commit, so phones pick up each new version automatically.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons audio _site/
          sed -i "s/const CACHE = 'lucky-v[0-9]*';/const CACHE = 'lucky-${GITHUB_SHA::8}';/" _site/sw.js
          grep -q "lucky-${GITHUB_SHA::8}" _site/sw.js

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
